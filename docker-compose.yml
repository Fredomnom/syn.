# docker compose up -d   →   http://localhost:8080 öffnen und dein Konto anlegen
services:
  syn:
    build:
      context: .
      target: slim        # „full“ = mit Telegram, Instagram (API), PlayStation
    # image: ghcr.io/fredomnom/syn:latest   # oder :full
    container_name: syn
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Ohne diese beiden legst du dein Konto beim ersten Aufruf im Browser an.
      # SYN_ADMIN_USER: admin
      # SYN_ADMIN_PASSWORD: mindestens-8-zeichen
      # SYN_DISABLE_IMPORTERS: "instagram,discord"
      # SYN_SESSION_HOURS: "24"
    volumes:
      - syn-data:/data

volumes:
  syn-data:
