# docker compose up -d   →   http://localhost:8080
services:
  syn:
    build:
      context: .
      target: slim        # „full“ = mit Telegram, Instagram (API), PlayStation
    # image: ghcr.io/fredomnom/syn:latest   # oder :full
    container_name: syn
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SYN_ADMIN_USER: ${SYN_ADMIN_USER:-admin}
      SYN_ADMIN_PASSWORD: ${SYN_ADMIN_PASSWORD:?Bitte SYN_ADMIN_PASSWORD setzen (mind. 8 Zeichen)}
      # SYN_DISABLE_IMPORTERS: "instagram,discord"
      # SYN_SESSION_HOURS: "24"
    volumes:
      - syn-data:/data

volumes:
  syn-data:
